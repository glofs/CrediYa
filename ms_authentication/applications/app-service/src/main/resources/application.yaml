server:
  port: 8082
spring:
  application:
    name: "ms_authentication"
  devtools:
    add-properties: false
  r2dbc:
    host: localhost
    port: 5432
    database: users
    schema: public
    username: postgres
    password: 1234
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

logging:
  level:
    org:
      springframework:
        r2dbc=DEBUG:
