server:
  port: 8080
spring:
  application:
    name: "ms_requests"
  devtools:
    add-properties: false
  r2dbc:
    host: localhost
    port: 5432
    database: loans
    schema: public
    username: postgres
    password: 1234
  profiles:
    include: null
adapter:
  restconsumer:
    timeout: 5000
    host: "http://localhost:8082"
    path: "/api/v1/user/consult"
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
logging:
  level:
    org:
      springframework:
        r2dbc=DEBUG: